# Namespace is NOT set here - it comes from how the chart is installed
# (`helm install -n ecommerce ...`, or a FluxCD HelmRelease's spec.targetNamespace).
# Every template below uses {{ .Release.Namespace }}, never a hardcoded name.

image:
  # Pulled from the Artifactory Docker registry. Each service's image is
  # "{repository}/<service>:{tag}", e.g.
  # cloud-build.cav-test.com/cav-ecommerce/order-service:42
  repository: cloud-build.cav-test.com/cav-ecommerce
  tag: "5"
  pullPolicy: IfNotPresent
  # Name of the Kubernetes Secret (kubernetes.io/dockerconfigjson) holding
  # credentials for the Artifactory registry above. Required because
  # cloud-build.cav-test.com is private - Jenkins having push access does
  # NOT give the cluster pull access. Create it once per namespace with:
  #   kubectl create secret docker-registry artifactory-pull-secret \
  #     --docker-server=cloud-build.cav-test.com \
  #     --docker-username=<your-artifactory-username> \
  #     --docker-password=<your-artifactory-password> \
  #     --namespace=ecommerce
  # Leave blank ("") to disable (e.g. if the registry is ever made public).
  pullSecretName: artifactory-pull-secret

ingress:
  className: traefik
  # shop.<domainSuffix>, auth.<domainSuffix>, products.<domainSuffix>, orders.<domainSuffix>, rabbitmq.<domainSuffix>
  domainSuffix: "65.19.151.234.nip.io"

# ---------------------------------------------------------------------------
# Postgres connection. host/port are a SINGLE shared value for all three
# services - auth/product/order only differ by database NAME, not by host.
#
# Two different ways the Jenkins pipeline keeps this pointed at a live TDM
# clone, depending on the "TDM Cloning" step's "Run Clone" checkbox
# (TdmCloneCreateStep/Builder's runClone field, default false):
#   - runClone=true  (not used by this pipeline, kept for completeness/manual
#     use): TDM runs its own engine Pod. TdmCloneLifecycleExecutor publishes
#     TDM_CONNECT_HOST/TDM_CONNECT_PORT - an in-cluster DNS name like
#     tdm-postgresql-<id>-<hash>.ecommerce.svc.cluster.local:5432 - and the
#     pipeline patches database.host/database.port here directly, with
#     postgres.enabled left false (the app talks straight to TDM's Pod).
#   - runClone=false (what this pipeline actually sends - see
#     runTdmCloningOnly() in the Jenkinsfile): TDM only creates/extends the
#     clone's storage and NFS-exports it, publishing TDM_CLONE_NFS_SERVER/
#     TDM_CLONE_NFS_EXPORT_PATH instead. The pipeline sets postgres.enabled
#     true and postgres.nfs.server/path below instead, and resets
#     database.host/port back to this chart's OWN "postgres"/5432 Service -
#     the chart's own postgres.yaml (not TDM) is what actually runs the
#     database, NFS-mounting the clone's exported data directory directly.
# Either way: commit+push, Flux's HelmRelease picks up the commit and
# re-renders, rolling every pod that reads DATABASE_URL from the Secret.
# ---------------------------------------------------------------------------
database:
  host: tdm-postgresql-6adf2426120c34c34e709b1f-2b478fee.ecommerce.svc.cluster.local
  port: 5432
  user: ecommerce
  password: ecommerce123
  names:
    auth: ecommerce_auth
    product: ecommerce_products
    order: ecommerce_orders

# In-cluster Postgres StatefulSet. OFF by default - either database.* above
# points straight at a TDM-run engine Pod (runClone=true), or this is a
# standalone run with no TDM behind it at all.
#
# nfs.enabled true is the runClone=false path above: postgres.yaml mounts
# the TDM clone's own NFS export directly (volumes[].nfs, no PVC/
# StorageClass involved) instead of provisioning its own empty
# volumeClaimTemplates storage - see that template's own comment for the
# baked-in-credentials open risk this carries. nfs.server/path are
# meaningless (and ignored by the template) while nfs.enabled is false.
postgres:
  enabled: false
  storage: 5Gi
  nfs:
    enabled: false
    server: ""
    path: ""

mongodb:
  storage: 5Gi

redis:
  storage: 1Gi

rabbitmq:
  storage: 2Gi

secrets:
  jwtSecret: super-secret-jwt-key-change-in-production
  jwtRefreshSecret: super-secret-refresh-key-change-in-production
  mongoUser: ecommerce
  mongoPassword: ecommerce123
  rabbitmqUser: ecommerce
  rabbitmqPassword: ecommerce123
  cloudinaryCloudName: your-cloud
  cloudinaryApiKey: your-key
  cloudinaryApiSecret: your-secret
  stripeSecretKey: sk_test_placeholder
  stripeWebhookSecret: whsec_placeholder
  resendApiKey: re_placeholder

config:
  jwtExpiresIn: 15m
  jwtRefreshExpiresIn: 7d
  fromEmail: noreply@ecommerce.com
