# Queue consumer - no Service / no ports.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      initContainers:
        - name: wait-for-deps
          image: redis:7-alpine
          command:
            - sh
            - -c
            - |
              for h in "mongodb 27017" "rabbitmq 5672"; do
                set -- $h
                until nc -z "$1" "$2"; do echo "waiting for $1"; sleep 2; done
              done
      containers:
        - name: notification-service
          image: "{{ .Values.image.repository }}/ecommerce-notification-service:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: RABBITMQ_URL
              valueFrom: { secretKeyRef: { name: ecommerce-secrets, key: RABBITMQ_URL } }
            - name: MONGODB_URI
              valueFrom: { secretKeyRef: { name: ecommerce-secrets, key: MONGODB_URI } }
            - name: RESEND_API_KEY
              valueFrom: { secretKeyRef: { name: ecommerce-secrets, key: RESEND_API_KEY } }
            - name: FROM_EMAIL
              valueFrom: { configMapKeyRef: { name: ecommerce-config, key: FROM_EMAIL } }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
