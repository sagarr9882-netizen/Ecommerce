apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: product-service
  ports:
    - port: 3002
      targetPort: 3002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      {{- if .Values.image.pullSecretName }}
      imagePullSecrets:
        - name: {{ .Values.image.pullSecretName }}
      {{- end }}
      initContainers:
        - name: wait-for-deps
          image: redis:7-alpine
          command:
            - sh
            - -c
            - |
              for h in "{{ .Values.database.host }} {{ .Values.database.port }}" "mongodb 27017" "redis 6379"; do
                set -- $h
                until nc -z "$1" "$2"; do echo "waiting for $1"; sleep 2; done
              done
      containers:
        - name: product-service
          image: "{{ .Values.image.repository }}/product-service:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 3002
          env:
            - name: PORT
              value: "3002"
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: ecommerce-secrets, key: PRODUCT_DATABASE_URL } }
            - name: MONGODB_URI
              valueFrom: { secretKeyRef: { name: ecommerce-secrets, key: MONGODB_URI } }
            - name: REDIS_URL
              valueFrom: { secretKeyRef: { name: ecommerce-secrets, key: REDIS_URL } }
            - name: CLOUDINARY_CLOUD_NAME
              valueFrom: { secretKeyRef: { name: ecommerce-secrets, key: CLOUDINARY_CLOUD_NAME } }
            - name: CLOUDINARY_API_KEY
              valueFrom: { secretKeyRef: { name: ecommerce-secrets, key: CLOUDINARY_API_KEY } }
            - name: CLOUDINARY_API_SECRET
              valueFrom: { secretKeyRef: { name: ecommerce-secrets, key: CLOUDINARY_API_SECRET } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: ecommerce-secrets, key: JWT_SECRET } }
            - name: FRONTEND_URL
              valueFrom: { configMapKeyRef: { name: ecommerce-config, key: FRONTEND_URL } }
          readinessProbe:
            tcpSocket: { port: 3002 }
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 3002 }
            initialDelaySeconds: 45
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 512Mi }
