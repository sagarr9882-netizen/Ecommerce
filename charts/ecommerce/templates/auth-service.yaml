apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: auth-service
  ports:
    - port: 3001
      targetPort: 3001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      initContainers:
        - name: wait-for-postgres
          image: redis:7-alpine
          command: ["sh", "-c", "until nc -z {{ .Values.database.host }} {{ .Values.database.port }}; do echo waiting for postgres; sleep 2; done"]
      containers:
        - name: auth-service
          image: "{{ .Values.image.repository }}/auth-service:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: ecommerce-secrets, key: AUTH_DATABASE_URL } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: ecommerce-secrets, key: JWT_SECRET } }
            - name: JWT_REFRESH_SECRET
              valueFrom: { secretKeyRef: { name: ecommerce-secrets, key: JWT_REFRESH_SECRET } }
            - name: JWT_EXPIRES_IN
              valueFrom: { configMapKeyRef: { name: ecommerce-config, key: JWT_EXPIRES_IN } }
            - name: JWT_REFRESH_EXPIRES_IN
              valueFrom: { configMapKeyRef: { name: ecommerce-config, key: JWT_REFRESH_EXPIRES_IN } }
            - name: FRONTEND_URL
              valueFrom: { configMapKeyRef: { name: ecommerce-config, key: FRONTEND_URL } }
          readinessProbe:
            tcpSocket: { port: 3001 }
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: 3001 }
            initialDelaySeconds: 45
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 512Mi }
