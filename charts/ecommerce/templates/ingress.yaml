apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecommerce
  namespace: {{ .Release.Namespace }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: "shop.{{ .Values.ingress.domainSuffix }}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { number: 3000 } }
    - host: "auth.{{ .Values.ingress.domainSuffix }}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: auth-service, port: { number: 3001 } }
    - host: "products.{{ .Values.ingress.domainSuffix }}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: product-service, port: { number: 3002 } }
    - host: "orders.{{ .Values.ingress.domainSuffix }}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: order-service, port: { number: 3003 } }
    - host: "rabbitmq.{{ .Values.ingress.domainSuffix }}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: rabbitmq, port: { number: 15672 } }
