# Dev defaults. CHANGE EVERY VALUE before using this anywhere other than a
# local/demo cluster, and prefer sealed-secrets / external-secrets / your CI
# system's own secret store over committing real secrets to values.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.database.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.database.password | quote }}
  MONGO_USER: {{ .Values.secrets.mongoUser | quote }}
  MONGO_PASSWORD: {{ .Values.secrets.mongoPassword | quote }}
  RABBITMQ_USER: {{ .Values.secrets.rabbitmqUser | quote }}
  RABBITMQ_PASSWORD: {{ .Values.secrets.rabbitmqPassword | quote }}

  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  JWT_REFRESH_SECRET: {{ .Values.secrets.jwtRefreshSecret | quote }}

  # One shared host:port (values.database.host/port - overwritten by the CI/CD
  # pipeline with the TDM clone's host/port after a Kubernetes-mode clone-up),
  # each service keeping its own fixed database name.
  AUTH_DATABASE_URL: "postgresql://{{ .Values.database.user }}:{{ .Values.database.password }}@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.names.auth }}"
  PRODUCT_DATABASE_URL: "postgresql://{{ .Values.database.user }}:{{ .Values.database.password }}@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.names.product }}"
  ORDER_DATABASE_URL: "postgresql://{{ .Values.database.user }}:{{ .Values.database.password }}@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.names.order }}"

  MONGODB_URI: "mongodb://{{ .Values.secrets.mongoUser }}:{{ .Values.secrets.mongoPassword }}@mongodb:27017/ecommerce?authSource=admin"
  REDIS_URL: "redis://redis:6379"
  RABBITMQ_URL: "amqp://{{ .Values.secrets.rabbitmqUser }}:{{ .Values.secrets.rabbitmqPassword }}@rabbitmq:5672"

  CLOUDINARY_CLOUD_NAME: {{ .Values.secrets.cloudinaryCloudName | quote }}
  CLOUDINARY_API_KEY: {{ .Values.secrets.cloudinaryApiKey | quote }}
  CLOUDINARY_API_SECRET: {{ .Values.secrets.cloudinaryApiSecret | quote }}
  STRIPE_SECRET_KEY: {{ .Values.secrets.stripeSecretKey | quote }}
  STRIPE_WEBHOOK_SECRET: {{ .Values.secrets.stripeWebhookSecret | quote }}
  RESEND_API_KEY: {{ .Values.secrets.resendApiKey | quote }}
