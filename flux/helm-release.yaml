# Deploys charts/ecommerce (same repo) into the "ecommerce" namespace.
#
# No GitRepository is defined here on purpose: the cavisson-agent that
# bootstraps Flux against THIS repo (FLUX_GIT_URL=.../sagarr9882-netizen/Ecommerce,
# FLUX_GIT_PATH=./flux - see ../README.md) auto-creates its own GitRepository
# named "flux-system" in the "flux-system" namespace, tracking this same repo.
# Since the chart already lives in the repo Flux is bootstrapped against,
# this HelmRelease just references that existing source directly instead of
# creating a second, redundant GitRepository pointed at the same place.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ecommerce
  namespace: ecommerce
spec:
  interval: 1m
  chart:
    spec:
      chart: charts/ecommerce
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  install:
    createNamespace: true
  upgrade:
    # Needed because of charts/ecommerce/templates/postgres.yaml's
    # postgres.nfs.enabled switch: flipping it adds/removes the
    # StatefulSet's volumeClaimTemplates block entirely (PVC-backed volume
    # <-> plain NFS volume), and Kubernetes forbids changing
    # volumeClaimTemplates on an EXISTING StatefulSet via a normal
    # patch/apply - that part of the upgrade is silently rejected, so the
    # StatefulSet (and the running pod's mount) just stays on whatever it
    # was before, even though values.yaml and the HelmRelease itself show
    # "upgraded" successfully. `force: true` makes Helm delete+recreate
    # any resource whose update is rejected for an immutable-field reason
    # like this, instead of leaving it stuck on the old definition.
    force: true
  # Deliberately no `spec.values` override - the chart's own values.yaml
  # (charts/ecommerce/values.yaml, inside this same repo) is the single
  # source of truth, and the Jenkins pipeline edits THAT file directly
  # (image.tag, database.host, database.port) rather than this object, so
  # there is only one place values can drift from what's actually running.
